<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shield-fill" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F766E" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <clipPath id="shield-clip">
      <polygon points="3,14 14,3 61,3 61,50 50,61 3,61" />
    </clipPath>
  </defs>

  <!-- Full-bleed bold chamfered medical chassis -->
  <polygon
    points="3,14 14,3 61,3 61,50 50,61 3,61"
    fill="url(#shield-fill)"
    stroke="#042F2E"
    stroke-width="3"
  />

  <!-- Animated high-contrast bright scanner band -->
  <g clip-path="url(#shield-clip)">
    <rect x="0" y="-12" width="64" height="14" fill="#2DD4BF" fill-opacity="0.55">
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0; 0 76; 0 0"
        dur="1.8s"
        repeatCount="indefinite"
      />
    </rect>
    <rect x="0" y="-4" width="64" height="5" fill="#CCFBF1">
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0; 0 76; 0 0"
        dur="1.8s"
        repeatCount="indefinite"
      />
    </rect>
  </g>

  <!-- Large high-contrast medical cross -->
  <path
    d="M32 14V50M14 32H50"
    stroke="#FFFFFF"
    stroke-width="8"
    stroke-linecap="square"
  >
    <animate attributeName="stroke" values="#FFFFFF;#99F6E4;#FFFFFF" dur="1.8s" repeatCount="indefinite" />
  </path>
</svg>
